kind = "web"
previewPath = "/"
title = "Crypsor"
version = "1.0.0"
id = "artifacts/crypsor"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20619

[services.development]
run = "pnpm --filter @workspace/crypsor run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/crypsor", "run", "build" ]
serve = "static"
publicDir = "artifacts/crypsor/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20619"
BASE_PATH = "/"

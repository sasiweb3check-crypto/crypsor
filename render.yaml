# Opt-in example only: no existing service has been changed or deployed.
services:
  - type: web
    name: hunter-private-pilot
    runtime: node
    plan: free
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm build:render
    startCommand: corepack pnpm start:api
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: HUNTER_API_TOKEN
        sync: false
      - key: AIVEN_DATABASE_URL
        sync: false
      - key: PG_POOL_MAX
        value: 2

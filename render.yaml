# Crypsor — API (always-on Node) + frontend (static CDN) on Render
# Blueprint: https://render.com/docs/blueprint-spec
#
# After first deploy, set secrets on crypsor-api in the dashboard (sync: false vars).
# Set CORS_ORIGIN on crypsor-api to the crypsor-web URL (e.g. https://crypsor-web.onrender.com).

services:
  - type: web
    name: crypsor-api
    runtime: node
    # free = spins down after idle (ok for first bring-up). Upgrade to starter for always-on pipeline.
    plan: free
    region: oregon
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: AIVEN_DATABASE_URL
        sync: false
      - key: AIVEN_REDIS_URL
        sync: false
      - key: HELIUS_API_KEY
        sync: false
      - key: GMGN_API_KEY
        sync: false
      - key: GMGN_PROXIES
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: crypsor-web
    runtime: static
    plan: free
    region: oregon
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @workspace/crypsor run build
    staticPublishPath: artifacts/crypsor/dist/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_URL
        value: https://crypsor-api.onrender.com

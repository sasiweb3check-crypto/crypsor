# Keepalive safety net — wakes a sleeping host so the scanner pipeline runs
# even when nobody has the app open.
#
# Needed for Vercel Hobby and Render free (they freeze / spin down without
# traffic). Not needed on Render Starter (always-on).
#
# Set GitHub Actions variable APP_URL to the live origin, e.g.
#   https://crypsor.onrender.com
# Without APP_URL the job no-ops so it cannot hit a stale host.

name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping pipeline tick
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          if [ -z "${APP_URL:-}" ]; then
            echo "APP_URL repo variable not set — skip (see docs/UPTIME.md)"
            exit 0
          fi
          APP_URL="${APP_URL%/}"
          if [ -n "${CRON_SECRET:-}" ]; then
            echo "tick (authorized) → ${APP_URL}"
            curl -sS --max-time 55 -H "Authorization: Bearer ${CRON_SECRET}" \
              "${APP_URL}/api/cron/tick" | head -c 400 || true
          else
            echo "keepalive (public) → ${APP_URL}"
            curl -sS --max-time 55 "${APP_URL}/api/keepalive" | head -c 400 || true
          fi
          echo
          sleep 50
          curl -sS --max-time 40 "${APP_URL}/api/keepalive" | head -c 200 || true
